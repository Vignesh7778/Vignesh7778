name: Generate ASCII & Wordmark Assets

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  ascii:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate ASCII & Wordmark SVGs
        run: |
          node scripts/generatePortrait.js
          node scripts/generateWordmark.js

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update ascii & wordmark assets"
          file_pattern: "assets/*.svg"
