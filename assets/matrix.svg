<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%" height="100%">
  <style>
    .code-col { font-family: monospace; font-size: 14px; fill: #00FF66; opacity: 0.8; }
    .fall-1 { animation: fall 3s linear infinite; }
    .fall-2 { animation: fall 4.2s linear infinite 1s; }
    .fall-3 { animation: fall 3.5s linear infinite 0.5s; }
    @keyframes fall {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.9; }
      100% { transform: translateY(200px); opacity: 0; }
    }
  </style>
  <rect width="800" height="150" fill="#0D1117"/>
  <g class="code-col">
    <text x="50" y="20" class="fall-1">0 1 0 1 1 0 1 0 1</text>
    <text x="180" y="20" class="fall-2">JAVA SPRING REACT</text>
    <text x="350" y="20" class="fall-3">SECURITY HARDENED</text>
    <text x="520" y="20" class="fall-1">00FF66 00D2FF 161B22</text>
    <text x="680" y="20" class="fall-2">FULL STACK DEV</text>
  </g>
</svg>
