<svg fill="none" viewBox="0 0 950 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="part-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <filter id="p-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="950" height="120" rx="12" fill="url(#part-bg)"/>

  <!-- Cyber Particle Matrix Dots -->
  <circle cx="100" cy="30" r="2" fill="#00FF66" filter="url(#p-glow)" opacity="0.8"/>
  <circle cx="240" cy="80" r="3" fill="#00D2FF" filter="url(#p-glow)" opacity="0.7"/>
  <circle cx="380" cy="40" r="1.5" fill="#00FF66" opacity="0.9"/>
  <circle cx="520" cy="90" r="2.5" fill="#00D2FF" filter="url(#p-glow)" opacity="0.6"/>
  <circle cx="660" cy="25" r="2" fill="#00FF66" filter="url(#p-glow)" opacity="0.8"/>
  <circle cx="800" cy="75" r="3" fill="#00D2FF" opacity="0.7"/>
  <circle cx="900" cy="35" r="1.5" fill="#00FF66" filter="url(#p-glow)" opacity="0.9"/>

  <!-- Scanning Cyber Beam -->
  <line x1="50" y1="60" x2="900" y2="60" stroke="#00FF66" stroke-width="1" stroke-dasharray="8,8" opacity="0.3"/>
</svg>
