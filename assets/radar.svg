<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="radarGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .sweep { transform-origin: 100px 100px; animation: spin 4s linear infinite; }
    .blip { animation: pulse 2s ease-in-out infinite alternate; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0% { opacity: 0.2; } 100% { opacity: 1; } }
  </style>
  <circle cx="100" cy="100" r="90" fill="#0D1117" stroke="#00FF66" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#00FF66" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="100" cy="100" r="30" fill="none" stroke="#00FF66" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="100" y1="10" x2="100" y2="190" stroke="#00FF66" stroke-width="0.75" stroke-opacity="0.4"/>
  <line x1="10" y1="100" x2="190" y2="100" stroke="#00FF66" stroke-width="0.75" stroke-opacity="0.4"/>
  <g class="sweep">
    <path d="M 100 100 L 100 10 A 90 90 0 0 1 190 100 Z" fill="url(#radarGrad)"/>
    <line x1="100" y1="100" x2="100" y2="10" stroke="#00FF66" stroke-width="2"/>
  </g>
  <circle class="blip" cx="130" cy="65" r="4" fill="#00D2FF"/>
  <circle class="blip" cx="75" cy="140" r="3" fill="#00FF66"/>
</svg>
